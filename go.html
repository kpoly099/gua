<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Loading...</title>
</head>
<body>
<div id="content"></div>
<script>
  // ?ids=xxx পড়া
  const ids = (new URLSearchParams(window.location.search)
              .get('ids') || '').replace(/[^a-zA-Z0-9\-_]/g, '');

  if (ids) {
    // নিজের সাইটের ভেতরের পেজ fetch করে inject করা
    fetch('/video/' + ids + '.html')
      .then(r => {
        if (!r.ok) throw new Error('not found');
        return r.text();
      })
      .then(data => {
        document.getElementById('content').innerHTML = data;
      })
      .catch(err => {
        // না পেলে সরাসরি ওই পেজেই পাঠিয়ে দাও
        window.location.href = '/video/' + ids + '.html';
      });
  } else {
    window.location.href = '/';
  }
</script>
</body>
</html>
