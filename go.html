<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting...</title>
<script>
  // ===== সেটিং (দরকার হলে এখানে বদলাও) =====
  const BASE_URL = 'https://ny.livezstream.com/video/'; // post ফোল্ডার
  const EXT      = '.html';  // post URL-এ .html না থাকলে এটা '' করে দাও

  // ?ids=xxx থেকে value পড়া
  const params = new URLSearchParams(window.location.search);
  let ids = (params.get('ids') || '').replace(/[^a-zA-Z0-9\-_]/g, '');

  if (ids) {
    window.location.href = BASE_URL + ids + EXT;
  } else {
    window.location.href = 'https://ny.livezstream.com/';
  }
</script>
<meta http-equiv="refresh" content="3;url=https://ny.livezstream.com/">
</head>
<body>
  <p>Please wait...</p>
  <a href="https://ny.livezstream.com/">Go to homepage</a>
</body>
</html>
